name: Bug report
description: Report a reproducible problem in PRDC
title: "[Bug] "
labels: [bug, triage]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed credentials, private RDG data, internal hosts, and sensitive paths.
          required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Describe what happened and include the exact error when available.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: PRDC version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 x64
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - RDG file handling
        - Groups and servers
        - RDP connection
        - User interface or theme
        - Build or packaging
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized logs or screenshots. Never attach a production RDG file.
